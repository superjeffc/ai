<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Kite AI</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    body { background-color: #111827; color: #f3f4f6; font-family: 'Outfit', sans-serif; }
    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-thumb { background: #374151; border-radius: 2px; }
    .prose h1 { font-size: 1.3rem; font-weight: bold; margin-bottom: 0.5rem; color: #fff; }
    .prose h2 { font-size: 1.15rem; font-weight: bold; margin-bottom: 0.4rem; color: #fff; }
    .prose ul { list-style-type: disc; margin-left: 1.1rem; margin-bottom: 0.5rem; color: rgba(255,255,255,0.8); }
    .prose ol { list-style-type: decimal; margin-left: 1.1rem; margin-bottom: 0.5rem; color: rgba(255,255,255,0.8); }
    .prose p { margin-bottom: 0.4rem; font-size: 0.95rem; }
    .prose code { background-color: rgba(0,0,0,0.3); padding: 0.125rem 0.25rem; border-radius: 0.25rem; color: #60a5fa; font-family: monospace; font-size: 0.85rem; }
    
    .prose table { width: 100%; border-collapse: collapse; margin-top: 0.75rem; margin-bottom: 0.75rem; border: 1px solid #1f2937; }
    .prose th { border-bottom: 2px solid #374151; background-color: #1f2937; padding: 0.5rem; text-align: left; font-weight: bold; color: #fff; font-size: 0.85rem; }
    .prose td { border-bottom: 1px solid #1f2937; padding: 0.5rem; font-size: 0.85rem; color: rgba(255,255,255,0.8); }

    /* Custom layout styling to guarantee input/button responsiveness and prevent clipping */
    .search-container {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      width: 100%;
    }
    .search-input-wrapper {
      position: relative;
      width: 100%;
      box-sizing: border-box;
    }
    .search-input {
      width: 100%;
      min-width: 0;
      box-sizing: border-box;
      text-transform: uppercase;
      padding-right: 2.5rem !important; /* Space for the clear X button */
    }
    .clear-input-btn {
      position: absolute;
      right: 0.75rem;
      top: 50%;
      transform: translateY(-50%);
      background: transparent;
      border: none;
      color: #9ca3af; /* gray-400 */
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0;
      width: 1.25rem;
      height: 1.25rem;
      border-radius: 50%;
      transition: color 0.15s, background-color 0.15s;
    }
    .clear-input-btn:hover {
      color: #f3f4f6; /* gray-100 */
      background-color: rgba(255, 255, 255, 0.15);
    }
    .clear-input-btn.hidden {
      display: none;
    }
    .search-button {
      width: 100%;
      box-sizing: border-box;
      justify-content: center;
      flex-shrink: 0;
    }
    @media (min-width: 640px) {
      .search-container {
        flex-direction: row;
      }
      .search-input-wrapper {
        flex: 1;
        width: 0;
      }
      .search-button {
        width: auto;
      }
    }
  </style>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
</head>
<body class="flex flex-col h-[100dvh] w-full max-w-4xl mx-auto p-3 sm:p-4">

  <header class="flex justify-between items-center py-2 sm:py-4 border-b border-gray-800 shrink-0">
    <div class="flex items-center gap-2">
      <span class="w-2.5 h-2.5 bg-blue-500 rounded-full animate-pulse"></span>
      <h1 class="text-lg sm:text-xl font-bold tracking-tight text-white">Kite AI</h1>
    </div>
  </header>

  <div id="synth-container" class="flex-1 flex flex-col overflow-hidden mt-4">
    <div class="w-full bg-gray-900 border border-gray-800 p-4 rounded-xl mb-4 shrink-0">
      <h2 class="text-sm font-semibold text-gray-300 mb-2">Earnings Synthesizer</h2>
      <div class="search-container">
        <div class="search-input-wrapper">
          <input type="text" id="synth-tickers" placeholder="e.g. AAPL, MSFT, NVDA, AMD" value="AAPL, MSFT, NVDA" class="search-input bg-gray-950 border border-gray-800 rounded-lg px-3 py-2 text-white placeholder-gray-500 outline-none focus:border-gray-700 text-sm">
          <button type="button" id="clear-tickers-btn" class="clear-input-btn hidden" onclick="clearTickersInput()" aria-label="Clear input">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-4 h-4">
              <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
            </svg>
          </button>
        </div>
        <button onclick="runSynthesis()" class="search-button bg-blue-600 hover:bg-blue-500 text-white px-4 py-2 rounded-lg text-sm font-semibold transition cursor-pointer flex items-center gap-1.5" id="synth-btn">
          <span>Synthesize</span>
        </button>
      </div>
      <p class="text-xs text-gray-500 mt-2">Analyzes up to 4 comma-separated tickers.</p>
    </div>

    <!-- Anchored Navigation / Quick Links -->
    <div id="synth-jump-bar" class="w-full bg-gray-900/40 border border-gray-800 p-2 rounded-xl mb-4 shrink-0 flex items-center gap-2 overflow-x-auto hidden">
      <span class="text-xs text-gray-400 font-semibold uppercase px-2 shrink-0">Jump To:</span>
      <div id="synth-jump-links" class="flex gap-2 overflow-x-auto"></div>
    </div>

    <div id="synth-results" class="flex-1 overflow-y-auto space-y-4 pr-1 hidden">
      <div class="grid grid-cols-1 md:grid-cols-2 gap-4" id="synth-ticker-cards"></div>
      
      <div class="bg-gray-900 border border-gray-800 p-4 rounded-xl prose max-w-none text-gray-200" id="synth-synthesis-card">
        <div class="border-b border-gray-800 pb-2 mb-3 flex justify-between items-center no-prose">
          <h3 class="text-base font-bold text-white">Comparative Synthesis Report</h3>
          <div class="flex gap-2">
            <button onclick="copySynthesis(this)" class="text-xs bg-gray-800 hover:bg-gray-700 text-gray-300 px-2 py-1 rounded transition flex items-center gap-1 cursor-pointer" title="Copy report">
              <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 5H6a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2v-1M8 5a2 2 0 002 2h2a2 2 0 002-2M8 5a2 2 0 012-2h2a2 2 0 012 2m0 0h2a2 2 0 012 2v3m2 4H10m0 0l3-3m-3 3l3 3"></path></svg>
              <span>Copy</span>
            </button>
            <button onclick="downloadSynthesis()" class="text-xs bg-gray-800 hover:bg-gray-700 text-gray-300 px-2 py-1 rounded transition flex items-center gap-1 cursor-pointer" title="Download report">
              <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>
              <span>Download</span>
            </button>
          </div>
        </div>
        <div id="synth-synthesis-content" class="text-sm leading-relaxed"></div>
      </div>
    </div>

    <div id="synth-loading" class="flex-1 flex flex-col items-center justify-center text-gray-400 hidden">
      <div class="w-8 h-8 border-4 border-blue-500 border-t-transparent rounded-full animate-spin mb-2"></div>
      <p class="text-sm font-medium" id="synth-loading-text">Fetching SEC EDGAR database...</p>
    </div>

    <div id="synth-placeholder" class="flex-1 flex flex-col items-center justify-center text-gray-500 text-sm border-2 border-dashed border-gray-800 rounded-xl p-8">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-12 h-12 mb-2 text-gray-600">
        <path stroke-linecap="round" stroke-linejoin="round" d="M7.5 14.25v2.25m3-4.5v4.5m3-6.75v6.75m3-9v9M6 20.25h12A2.25 2.25 0 0020.25 18V6A2.25 2.25 0 0018 3.75H6A2.25 2.25 0 003.75 6v12A2.25 2.25 0 006 20.25z" />
      </svg>
      <span>No tickers analyzed yet. Enter tickers above and click Synthesize.</span>
    </div>
  </div>

  <script src="/app.js"></script>
</body>
</html>
