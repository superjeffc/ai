<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Kite AI</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    body { background-color: #111827; color: #f3f4f6; font-family: 'Outfit', sans-serif; }
    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-thumb { background: #374151; border-radius: 2px; }
    .prose h1 { font-size: 1.3rem; font-weight: bold; margin-bottom: 0.5rem; color: #fff; }
    .prose h2 { font-size: 1.15rem; font-weight: bold; margin-bottom: 0.4rem; color: #fff; }
    .prose ul { list-style-type: disc; margin-left: 1.1rem; margin-bottom: 0.5rem; color: rgba(255,255,255,0.8); }
    .prose ol { list-style-type: decimal; margin-left: 1.1rem; margin-bottom: 0.5rem; color: rgba(255,255,255,0.8); }
    .prose p { margin-bottom: 0.4rem; font-size: 0.95rem; }
    .prose code { background-color: rgba(0,0,0,0.3); padding: 0.125rem 0.25rem; border-radius: 0.25rem; color: #60a5fa; font-family: monospace; font-size: 0.85rem; }
    
    .prose table { width: 100%; border-collapse: collapse; margin-top: 0.75rem; margin-bottom: 0.75rem; border: 1px solid #1f2937; }
    .prose th { border-bottom: 2px solid #374151; background-color: #1f2937; padding: 0.5rem; text-align: left; font-weight: bold; color: #fff; font-size: 0.85rem; }
    .prose td { border-bottom: 1px solid #1f2937; padding: 0.5rem; font-size: 0.85rem; color: rgba(255,255,255,0.8); }

    /* Custom layout styling to guarantee input/button responsiveness and prevent clipping */
    .search-container {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      width: 100%;
    }
    .search-input-wrapper {
      position: relative;
      width: 100%;
      box-sizing: border-box;
    }
    .search-input {
      width: 100%;
      min-width: 0;
      box-sizing: border-box;
      text-transform: uppercase;
      padding-right: 2.5rem !important; /* Space for the clear X button */
    }
    .clear-input-btn {
      position: absolute;
      right: 0.75rem;
      top: 50%;
      transform: translateY(-50%);
      background: transparent;
      border: none;
      color: #9ca3af; /* gray-400 */
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0;
      width: 1.25rem;
      height: 1.25rem;
      border-radius: 50%;
      transition: color 0.15s, background-color 0.15s;
    }
    .clear-input-btn:hover {
      color: #f3f4f6; /* gray-100 */
      background-color: rgba(255, 255, 255, 0.15);
    }
    .clear-input-btn.hidden {
      display: none;
    }
    .search-button {
      width: 100%;
      box-sizing: border-box;
      justify-content: center;
      flex-shrink: 0;
    }
    @media (min-width: 640px) {
      .search-container {
        flex-direction: row;
      }
      .search-input-wrapper {
        flex: 1;
        width: 0;
      }
      .search-button {
        width: auto;
      }
    }
  </style>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
</head>
<body class="flex flex-col h-[100dvh] w-full max-w-4xl mx-auto p-3 sm:p-4">

  <header class="flex justify-between items-center py-2 sm:py-4 border-b border-gray-800 shrink-0">
    <div class="flex items-center gap-2">
      <span class="w-2.5 h-2.5 bg-blue-500 rounded-full animate-pulse"></span>
      <h1 class="text-lg sm:text-xl font-bold tracking-tight text-white">Kite AI</h1>
    </div>
  </header>

  <div id="synth-container" class="flex-1 flex flex-col overflow-hidden mt-4">
    <div class="w-full bg-gray-900 border border-gray-800 p-4 rounded-xl mb-4 shrink-0">
      <h2 class="text-sm font-semibold text-gray-300 mb-2">Earnings Synthesizer</h2>
      <div class="search-container">
        <div class="search-input-wrapper">
          <input type="text" id="synth-tickers" placeholder="e.g. AAPL, MSFT, NVDA, AMD" value="AAPL, MSFT, NVDA" class="search-input bg-gray-950 border border-gray-800 rounded-lg px-3 py-2 text-white placeholder-gray-500 outline-none focus:border-gray-700 text-sm">
          <button type="button" id="clear-tickers-btn" class="clear-input-btn hidden" onclick="clearTickersInput()" aria-label="Clear input">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-4 h-4">
              <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
            </svg>
          </button>
        </div>
        <button onclick="runSynthesis()" class="search-button bg-blue-600 hover:bg-blue-500 text-white px-4 py-2 rounded-lg text-sm font-semibold transition cursor-pointer flex items-center gap-1.5" id="synth-btn">
          <span>Synthesize</span>
        </button>
      </div>
      <p class="text-xs text-gray-500 mt-2">Analyzes up to 4 comma-separated tickers.</p>
    </div>

    <!-- Anchored Navigation / Quick Links -->
    <div id="synth-jump-bar" class="w-full bg-gray-900/40 border border-gray-800 p-2 rounded-xl mb-4 shrink-0 flex items-center gap-2 overflow-x-auto hidden">
      <span class="text-xs text-gray-400 font-semibold uppercase px-2 shrink-0">Jump To:</span>
      <div id="synth-jump-links" class="flex gap-2 overflow-x-auto"></div>
    </div>

    <div id="synth-results" class="flex-1 overflow-y-auto space-y-4 pr-1 hidden">
      <div class="grid grid-cols-1 md:grid-cols-2 gap-4" id="synth-ticker-cards"></div>
      
      <div class="bg-gray-900 border border-gray-800 p-4 rounded-xl prose max-w-none text-gray-200" id="synth-synthesis-card">
        <div class="border-b border-gray-800 pb-2 mb-3 flex justify-between items-center no-prose">
          <h3 class="text-base font-bold text-white">Comparative Synthesis Report</h3>
          <div class="flex gap-2">
            <button onclick="copySynthesis(this)" class="text-xs bg-gray-800 hover:bg-gray-700 text-gray-300 px-2 py-1 rounded transition flex items-center gap-1 cursor-pointer" title="Copy report">
              <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 5H6a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2v-1M8 5a2 2 0 002 2h2a2 2 0 002-2M8 5a2 2 0 012-2h2a2 2 0 012 2m0 0h2a2 2 0 012 2v3m2 4H10m0 0l3-3m-3 3l3 3"></path></svg>
              <span>Copy</span>
            </button>
            <button onclick="downloadSynthesis()" class="text-xs bg-gray-800 hover:bg-gray-700 text-gray-300 px-2 py-1 rounded transition flex items-center gap-1 cursor-pointer" title="Download report">
              <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>
              <span>Download</span>
            </button>
          </div>
        </div>
        <div id="synth-synthesis-content" class="text-sm leading-relaxed"></div>
      </div>
    </div>

    <div id="synth-loading" class="flex-1 flex flex-col items-center justify-center text-gray-400 hidden">
      <div class="w-8 h-8 border-4 border-blue-500 border-t-transparent rounded-full animate-spin mb-2"></div>
      <p class="text-sm font-medium" id="synth-loading-text">Fetching SEC EDGAR database...</p>
    </div>

    <div id="synth-placeholder" class="flex-1 flex flex-col items-center justify-center text-gray-500 text-sm border-2 border-dashed border-gray-800 rounded-xl p-8">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-12 h-12 mb-2 text-gray-600">
        <path stroke-linecap="round" stroke-linejoin="round" d="M7.5 14.25v2.25m3-4.5v4.5m3-6.75v6.75m3-9v9M6 20.25h12A2.25 2.25 0 0020.25 18V6A2.25 2.25 0 0018 3.75H6A2.25 2.25 0 003.75 6v12A2.25 2.25 0 006 20.25z" />
      </svg>
      <span>No tickers analyzed yet. Enter tickers above and click Synthesize.</span>
    </div>
  </div>

  <script>
    window.tickerSummaries = {};
    window.synthesisReport = "";

    async function copyToClipboard(text, btnElement) {
      try {
        await navigator.clipboard.writeText(text);
        const originalText = btnElement.innerHTML;
        btnElement.innerHTML = \`
          <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>
          <span>Copied!</span>
        \`;
        setTimeout(() => {
          btnElement.innerHTML = originalText;
        }, 1500);
      } catch (err) {
        console.error("Clipboard copy failed:", err);
        const textarea = document.createElement("textarea");
        textarea.value = text;
        textarea.style.position = "fixed";
        document.body.appendChild(textarea);
        textarea.select();
        try {
          document.execCommand("copy");
          const originalText = btnElement.innerHTML;
          btnElement.innerHTML = \`
            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>
            <span>Copied!</span>
          \`;
          setTimeout(() => {
            btnElement.innerHTML = originalText;
          }, 1500);
        } catch (fallbackErr) {
          alert("Failed to copy text: " + fallbackErr.message);
        }
        document.body.removeChild(textarea);
      }
    }

    function downloadAsFile(filename, text) {
      const blob = new Blob([text], { type: "text/markdown;charset=utf-8;" });
      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");
      link.href = url;
      link.setAttribute("download", filename);
      link.style.visibility = 'hidden';
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
      URL.revokeObjectURL(url);
    }

    function scrollToElement(id) {
      const el = document.getElementById(id);
      const container = document.getElementById('synth-results');
      if (el && container) {
        const containerRect = container.getBoundingClientRect();
        const elRect = el.getBoundingClientRect();
        const scrollTarget = container.scrollTop + (elRect.top - containerRect.top) - 12;
        container.scrollTo({
          top: scrollTarget,
          behavior: 'smooth'
        });
      }
    }

    function copyTickerSummary(ticker, btn) {
      const summary = window.tickerSummaries[ticker] || "";
      copyToClipboard(summary, btn);
    }

    function downloadTickerSummary(ticker) {
      const summary = window.tickerSummaries[ticker] || "";
      downloadAsFile(ticker + "_earnings_report.md", summary);
    }

    function copySynthesis(btn) {
      copyToClipboard(window.synthesisReport, btn);
    }

    function downloadSynthesis() {
      downloadAsFile("comparative_earnings_synthesis.md", window.synthesisReport);
    }

    const synthTickersInput = document.getElementById('synth-tickers');
    const clearBtn = document.getElementById('clear-tickers-btn');

    function updateClearButtonVisibility() {
      if (synthTickersInput.value.length > 0) {
        clearBtn.classList.remove('hidden');
      } else {
        clearBtn.classList.add('hidden');
      }
    }

    function clearTickersInput() {
      synthTickersInput.value = '';
      updateClearButtonVisibility();
      synthTickersInput.focus({ preventScroll: true });
    }

    setTimeout(function() {
      synthTickersInput.focus({ preventScroll: true });
      const len = synthTickersInput.value.length;
      synthTickersInput.setSelectionRange(len, len);
      updateClearButtonVisibility();
    }, 100);

    synthTickersInput.addEventListener('input', function(e) {
      synthTickersInput.value = synthTickersInput.value.toUpperCase();
      updateClearButtonVisibility();
    });

    synthTickersInput.addEventListener('keydown', function(e) {
      if (e.key === 'Enter') {
        runSynthesis();
      }
    });

    async function runSynthesis() {
      const tickersVal = synthTickersInput.value.trim();
      if (!tickersVal) return;

      const tickersList = tickersVal.split(',').map(function(t) { return t.trim().toUpperCase(); }).filter(Boolean);
      if (tickersList.length > 4) {
        alert("Maximum of 4 tickers can be analyzed at a time.");
        return;
      }

      const btn = document.getElementById('synth-btn');
      const placeholder = document.getElementById('synth-placeholder');
      const loading = document.getElementById('synth-loading');
      const results = document.getElementById('synth-results');
      const loadingText = document.getElementById('synth-loading-text');

      btn.disabled = true;
      btn.classList.add('opacity-50', 'cursor-not-allowed');
      placeholder.classList.add('hidden');
      results.classList.add('hidden');
      loading.classList.remove('hidden');
      document.getElementById('synth-jump-bar').classList.add('hidden');

      const pollInterval = 3000;

      async function poll() {
        try {
          loadingText.innerText = "Ingesting " + tickersList.join(', ') + "...";
          
          const res = await fetch("/api/synthesize?tickers=" + encodeURIComponent(tickersList.join(',')));
          const data = await res.json();
          
          if (!data.success) {
            throw new Error(data.error || "Synthesis failed");
          }

          const cardsContainer = document.getElementById('synth-ticker-cards');
          cardsContainer.innerHTML = '';

          const jumpBar = document.getElementById('synth-jump-bar');
          const jumpLinks = document.getElementById('synth-jump-links');
          jumpLinks.innerHTML = '';

          for (const ticker of tickersList) {
            const btn = document.createElement('button');
            btn.className = "text-xs bg-gray-800 hover:bg-gray-700 text-gray-200 px-3 py-1.5 rounded-lg border border-gray-700 transition cursor-pointer font-semibold uppercase shrink-0";
            btn.textContent = ticker;
            btn.onclick = () => scrollToElement('ticker-card-' + ticker);
            jumpLinks.appendChild(btn);
          }
          
          const summaries = data.data.summaries;
          for (const ticker of tickersList) {
            const info = summaries[ticker];
            if (!info) continue;
            const card = document.createElement('div');
            card.id = 'ticker-card-' + ticker;
            card.className = "bg-gray-900 border border-gray-800 p-4 rounded-xl flex flex-col";
            
            if (info.error) {
              if (info.error === "Ingesting...") {
                card.innerHTML = 
                  '<div class="flex justify-between items-center border-b border-gray-800 pb-2 mb-2">' +
                    '<h4 class="font-bold text-white text-base">' + ticker + '</h4>' +
                    '<span class="px-2 py-0.5 rounded text-xs bg-blue-950/40 text-blue-400 border border-blue-900/50 animate-pulse">Ingesting...</span>' +
                  '</div>' +
                  '<p class="text-sm text-gray-400 flex-1">Ticker is being processed in a rate-limited background queue to comply with SEC requirements.</p>';
              } else {
                card.innerHTML = 
                  '<div class="flex justify-between items-center border-b border-gray-800 pb-2 mb-2">' +
                    '<h4 class="font-bold text-white text-base">' + ticker + '</h4>' +
                    '<span class="px-2 py-0.5 rounded text-xs bg-red-950/40 text-red-400 border border-red-900/50">Error</span>' +
                  '</div>' +
                  '<p class="text-sm text-red-400 flex-1">' + info.error + '</p>';
              }
            } else {
              window.tickerSummaries[ticker] = info.summary || '';
              card.innerHTML = 
                '<div class="flex justify-between items-center border-b border-gray-800 pb-2 mb-2">' +
                  '<h4 class="font-bold text-white text-base">' + ticker + '</h4>' +
                  '<div class="flex gap-2">' +
                    '<button onclick=\'copyTickerSummary("' + ticker + '", this)\' class="text-xs bg-gray-800 hover:bg-gray-700 text-gray-300 px-2 py-1 rounded transition flex items-center gap-1 cursor-pointer" title="Copy report">' +
                      '<svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 5H6a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2v-1M8 5a2 2 0 002 2h2a2 2 0 002-2M8 5a2 2 0 012-2h2a2 2 0 012 2m0 0h2a2 2 0 012 2v3m2 4H10m0 0l3-3m-3 3l3 3"></path></svg>' +
                      '<span>Copy</span>' +
                    '</button>' +
                    '<button onclick=\'downloadTickerSummary("' + ticker + '")\' class="text-xs bg-gray-800 hover:bg-gray-700 text-gray-300 px-2 py-1 rounded transition flex items-center gap-1 cursor-pointer" title="Download report">' +
                      '<svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>' +
                      '<span>Download</span>' +
                    '</button>' +
                  '</div>' +
                '</div>' +
                '<div class="text-xs text-gray-400 mb-3 space-y-0.5">' +
                  '<div>Filing Date: <span class="text-gray-200 font-medium">' + (info.filingDate || 'N/A') + '</span></div>' +
                  '<div>Accession: <span class="text-gray-200 font-medium font-mono">' + (info.accessionNumber || 'N/A') + '</span></div>' +
                '</div>' +
                '<div class="text-sm text-gray-300 leading-relaxed flex-1 prose max-w-none">' + marked.parse(info.summary || '') + '</div>';
            }
            cardsContainer.appendChild(card);
          }

          if (data.status !== "processing") {
            const compBtn = document.createElement('button');
            compBtn.className = "text-xs bg-blue-950/40 hover:bg-blue-900/50 text-blue-300 px-3 py-1.5 rounded-lg border border-blue-900/50 transition cursor-pointer font-semibold shrink-0";
            compBtn.textContent = "Comparison";
            compBtn.onclick = () => scrollToElement('synth-synthesis-card');
            jumpLinks.appendChild(compBtn);
          }
          jumpBar.classList.remove('hidden');

          if (data.status === "processing") {
            setTimeout(poll, pollInterval);
            loading.classList.remove('hidden');
            results.classList.remove('hidden');
            document.getElementById('synth-synthesis-card').classList.add('hidden');
          } else if (data.status === "synthesizing") {
            setTimeout(poll, pollInterval);
            loading.classList.add('hidden');
            results.classList.remove('hidden');
            document.getElementById('synth-synthesis-card').classList.remove('hidden');
            const synthContent = document.getElementById('synth-synthesis-content');
            synthContent.innerHTML = 
              '<div class="flex items-center gap-2 text-gray-400 py-4 justify-center">' +
                '<div class="w-4 h-4 border-2 border-blue-500 border-t-transparent rounded-full animate-spin"></div>' +
                '<span class="text-xs text-gray-400">Synthesizing comparative value-investing analysis...</span>' +
              '</div>';
          } else {
            const synthContent = document.getElementById('synth-synthesis-content');
            window.synthesisReport = data.data.synthesis || '';
            synthContent.innerHTML = marked.parse(window.synthesisReport);
            
            loading.classList.add('hidden');
            results.classList.remove('hidden');
            document.getElementById('synth-synthesis-card').classList.remove('hidden');
            
            btn.disabled = false;
            btn.classList.remove('opacity-50', 'cursor-not-allowed');
          }
        } catch (err) {
          alert("Error executing comparative analysis: " + err.message);
          loading.classList.add('hidden');
          placeholder.classList.remove('hidden');
          document.getElementById('synth-jump-bar').classList.add('hidden');
          btn.disabled = false;
          btn.classList.remove('opacity-50', 'cursor-not-allowed');
        }
      }

      poll();
    }
  </script>
</body>
</html>
